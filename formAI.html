<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register | Student Portal</title>
  <link rel="stylesheet" href="stylesAI.css">
</head>
<body>

  <nav class="navbar">
    <a href="index.html">Home</a>
    <a href="formAI.html">Register</a>
    <a href="thanksAI.html">Thank You</a>
  </nav>

  <header id="banner">
    <h1>Student Registration</h1>
    <p>Fill in your details below</p>
  </header>

  <main class="container">
    <form class="reg-form" action="thanksAI.html" method="get">

      <label for="name">Full name</label>
      <input type="text" id="name" name="name" placeholder="Your full name" required>

      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" required>

      <label for="roll">Roll number</label>
      <input type="text" id="roll" name="roll" placeholder="e.g. F26-1234" required>

      <label for="program">Program</label>
      <select id="program" name="program">
        <option>BS Artificial Intelligence</option>
        <option>BS Computer Science</option>
        <option>BS Software Engineering</option>
      </select>

      <label for="phone">Phone number</label>
      <input type="tel" id="phone" name="phone" placeholder="03XX-XXXXXXX">

      <button type="submit" class="btn">Register</button>
    </form>
  </main>

  <footer>&copy; 2026 Shoaib Hassan | NUTECH</footer>

</body>
</html>
